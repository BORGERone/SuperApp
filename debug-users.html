<!DOCTYPE html>
<html>
<head>
    <title>Debug Users API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; padding: 10px; margin: 10px 0; border-radius: 5px; color: #d63384; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Debug Users API</h1>
    <button onclick="testUsersAPI()">Test API Request</button>
    <button onclick="testWithToken()">Test With Token</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <div id="logs"></div>

    <script>
        function log(message, isError = false) {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = isError ? 'log error' : 'log';
            logEntry.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            logsDiv.appendChild(logEntry);
        }

        async function testUsersAPI() {
            log('Testing API without authentication...');
            try {
                const response = await fetch('http://localhost:3002/api/auth/users');
                log(`Response status: ${response.status}`);
                const data = await response.json();
                log(`Response data: ${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                log(`Error: ${error.message}`, true);
            }
        }

        async function testWithToken() {
            log('Getting token from localStorage...');
            const token = localStorage.getItem('accessToken');
            log(`Token: ${token ? 'found' : 'not found'}`);
            
            if (!token) {
                log('No token found, please login first', true);
                return;
            }

            log('Testing API with authentication...');
            try {
                const response = await fetch('http://localhost:3002/api/auth/users', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                log(`Response status: ${response.status}`);
                const data = await response.json();
                log(`Response data: ${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                log(`Error: ${error.message}`, true);
            }
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        // Auto-test on load
        window.onload = () => {
            log('Page loaded, testing API...');
            testWithToken();
        };
    </script>
</body>
</html>
